spring.application.name=merchant-service


server.port=8081
server.servlet.context-path=/merchant-service

# --- View resolution (equivalent of InternalResourceViewResolver bean in plain Spring) ---
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# --- MySQL DataSource (equivalent of the <bean id="dataSource"> in applicationContext.xml) ---
spring.datasource.url=jdbc:mysql://localhost:3306/merchant_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver